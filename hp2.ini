; NFS Hot Pursuit 2 (recompiled): settings. The game's Options > PC Settings changes them.
; Environment variables (HP2_NOSOUND ...) win over this file.

[video]
scale=2            ; the picture, times the PS2's: 1 to 8
fullscreen=0       ; 1 = borderless fullscreen (Alt+Enter)
window=960,720     ; the window's picture
smooth=1           ; 1 = smooth picture scaling, 0 = sharp
aspect=0           ; the race's picture: 0 = 4:3, 1 = 16:10, 2 = 16:9
aa_mode=0          ; anti-aliasing: 0 = off, 1 = MSAA, 2 = SMAA
aa_level=4         ; 2 or 4: MSAA samples, SMAA quality
aniso=0            ; anisotropic filtering: 0 = off, 2, 4, 8, 16
brightness=0       ; percent, -50 to 50
contrast=100        ; percent, 50 to 150
gamma=100           ; percent, 50 to 200: above 100 lighter
frame_rate=30       ; the race's, 30 or 60
vsync=1            ; 1 = the picture waits for the screen (no tearing), 0 = shown at once
draw_distance=200   ; percent, 100 to 400: 100 is the PS2's
profile=
language=ENGLISH     ; ENGLISH, FRENCH, GERMAN, ITALIAN, SPANISH, SWEDISH, or one of data\lang\
show_fps=0
max_detail=1       ; 1 = every object at its most detailed model, 0 = the PS2's levels of detail
reflections=0      ; the cars' reflections: 0 = the PS2's, 1 = advanced (new every frame), 2 = high (new every frame, twice the resolution)

log=on             ; on = the game writes speed.log (4 MB at most: its first and its last 2 MB), off = it writes no log at all
[audio]
volume=100           ; percent

[keyboard]       ; while driving: the virtual-key code of each action's key (0 = none)
controls=2
key_up=9      ; Cycle HUD | Tab
key_down=0      ; - | -
key_left=37      ; Steer Left | Left
key_right=39      ; Steer Right | Right
key_cross=38      ; Accelerate | Up
key_square=40      ; Brake / Reverse | Down
key_circle=72      ; Horn / Siren | H
key_triangle=67      ; Change View | C
key_l1=81      ; Look Back | Q
key_r1=32      ; Handbrake | Space
key_l2=90      ; Shift Down | Z
key_r2=88      ; Shift Up | X
key_r3=160      ; Speed Boost | L Shift
key_start=0      ; Pause | -
key_select=82      ; Reset Car | R
key_zone_freeze=70      ; Zone Freeze
key_zone_zoom=71      ; Zone Zoom

[player2]
player2=0          ; 0 = the second gamepad, or half of the keyboard; 1 = the first gamepad, player 1 has the keyboard
key2_up=84      ; Cycle HUD | T
key2_down=0      ; - | -
key2_left=65      ; Steer Left | A
key2_right=68      ; Steer Right | D
key2_cross=87      ; Accelerate | W
key2_square=83      ; Brake / Reverse | S
key2_circle=71      ; Horn / Siren | G
key2_triangle=86      ; Change View | V
key2_l1=69      ; Look Back | E
key2_r1=70      ; Handbrake | F
key2_l2=49      ; Shift Down | 1
key2_r2=50      ; Shift Up | 2
key2_r3=162      ; Speed Boost | L Ctrl
key2_start=0      ; Pause | -
key2_select=66      ; Reset Car | B
key2_zone_freeze=0
key2_zone_zoom=0

[gamepad]        ; its buttons are the DualShock 2's where the pad has them; what each does is the game's layout (A to D)
deadzone=24         ; the left stick, percent
steering=100        ; percent, above 100 sharper near the center
icons=0            ; 0 by the pad, 1 Xbox, 2 PlayStation
